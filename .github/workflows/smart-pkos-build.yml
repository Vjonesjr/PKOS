name: Smart PKOS build verification
on:
  push:
    branches: [smart-pkos-final-integration-20261102]
    paths:
      - '.github/workflows/smart-pkos-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Environment versions
        run: |
          node --version
          npm --version
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint (report separately; do not block compilation)
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Build web bundle with correct Base44 app context
        env:
          # Public app identifiers are injected at build time for standalone Capacitor APKs.
          VITE_BASE44_APP_ID: '6ab97588d935cf6dad456bf1'
          VITE_BASE44_APP_BASE_URL: 'https://gorgeous-smart-brain-flow.base44.app'
        run: |
          npm run build
          # Avoid a silently nonfunctional APK when Vite env vars were not embedded.
          grep -R -q '6ab97588d935cf6dad456bf1' dist/assets
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK (not signed for Play Store)
        working-directory: android
        run: bash ./gradlew assembleDebug --stacktrace
      - name: Verify debug APK identity and signature
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose "$APK" | tee /tmp/pkos-apk-signature.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/pkos-apk-signature.txt
          "$SDK_BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "name='com.smartpkos.app.scrolltest'"
      - name: Record lint outcome
        if: always()
        run: |
          echo "Lint outcome: ${{ steps.lint.outcome }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Capture build environment and output locations
        if: always()
        run: |
          mkdir -p build-diagnostics
          node --version > build-diagnostics/node-version.txt
          npm --version > build-diagnostics/npm-version.txt
          find android/app/build/outputs -maxdepth 5 -type f 2>/dev/null > build-diagnostics/android-outputs.txt || true
          git rev-parse HEAD > build-diagnostics/source-commit.txt
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smart-pkos-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-pkos-build-diagnostics
          path: |
            android/app/build/reports/**
            build-diagnostics/**
          if-no-files-found: ignore
