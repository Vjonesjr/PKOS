name: Build Smart PKOS Next Pass

on:
  push:
    paths:
      - ".github/workflows/pkos-next-pass.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download exact next-pass source and signer
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://uc6a622c88263d723443b72b4a36.dl.dropboxusercontent.com/cd/0/get/DK3onVZy10SGsyAanzQu3PHNfgzAhDffQIEstOiB71a14tf56icRJ_6OALDTL9fHZxOumVE1z8wS_3MykE4n606ZseuP-WmUDzuBcqkPBXHKod802Ce-ZrVerzFtg_xyTkwxYQPprUHI0KXrOfXQiLgDOF4I9-pHEVEg9EM_toF-9A/file?c_luid=a4cf56df' -o source.zip
          curl -fL 'https://uc2a78d038a8579e63e306dca05b.dl.dropboxusercontent.com/cd/0/get/DK0GJGbsbdXeYUhlI1btTYr5wIbBUJcW6dAM4sUzD1N14Cp3hWs9MvYEco6ersJVWHp-JIDxn79Xv3ppXW3K7NXHm3_vTB1PL-KbfeaBmy4STldcqcDkV1mQE5j76maDRQgOep7kfWkZG0NR1io_vZCa-k9lDDpVwp_22zqth9IYPA/file?c_luid=a4cf56df' -o debug.keystore
          echo "7973916d234ca8b50a9951164e4c6dffdbaa73665030f4d92ab5843b555e79d4  source.zip" | sha256sum -c -
          echo "61ec6cb786c6212e23f96ef765a19918778e775d0023554a68e69cb7d77d289c  debug.keystore" | sha256sum -c -
          mkdir app
          unzip -q source.zip -d app

      - name: Gate the intended UI and features
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          grep -F "const TABS=[['/','Home',Home],['/projects','Projects',FolderKanban],['/capture','Capture',Inbox],['/settings','Settings',Settings]];" src/components/Layout.jsx
          grep -F "Chats & saved links" src/pages/Settings.jsx
          grep -F "Use device timezone" src/pages/Settings.jsx
          grep -F "Light Blue" src/pages/Settings.jsx
          grep -F "Red" src/pages/Settings.jsx
          grep -F "recurring_tasks" src/lib/planImport.js
          grep -F "ChatLink" src/pages/ChatLinks.jsx
          grep -F "android.intent.action.SEND" android/app/src/main/AndroidManifest.xml

      - name: Bump install version
        shell: bash
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/build.gradle")
          s=p.read_text()
          s=re.sub(r"versionCode\s+\d+", "versionCode 20261029", s)
          s=re.sub(r'versionName\s+"[^"]+"', 'versionName "2026.10.28-next-pass"', s)
          p.write_text(s)
          PY

      - name: Install, lint, build frontend
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run build
          grep -R -F "Chats & saved links" dist/assets/*.js >/dev/null
          grep -R -F "Use device timezone" dist/assets/*.js >/dev/null
          grep -R -F "No supported Smart PKOS records" dist/assets/*.js >/dev/null

      - name: Sync and build Android
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          npx cap sync android
          grep -R -F "Chats & saved links" android/app/src/main/assets/public/assets/*.js >/dev/null
          grep -F "android.intent.action.SEND" android/app/src/main/AndroidManifest.xml
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Align, sign, verify
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="app/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" Smart-PKOS-NEXT-PASS-aligned.apk
          "$BT/apksigner" sign             --ks debug.keystore             --ks-key-alias androiddebugkey             --ks-pass pass:android             --key-pass pass:android             --out Smart-PKOS-NEXT-PASS-20261028.apk             Smart-PKOS-NEXT-PASS-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs Smart-PKOS-NEXT-PASS-20261028.apk | tee verify.txt
          "$BT/zipalign" -c -v 4 Smart-PKOS-NEXT-PASS-20261028.apk >/dev/null
          sha256sum Smart-PKOS-NEXT-PASS-20261028.apk | tee Smart-PKOS-NEXT-PASS-20261028.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Smart-PKOS-NEXT-PASS-20261028
          path: |
            Smart-PKOS-NEXT-PASS-20261028.apk
            Smart-PKOS-NEXT-PASS-20261028.sha256
            verify.txt
          retention-days: 7
          if-no-files-found: error
