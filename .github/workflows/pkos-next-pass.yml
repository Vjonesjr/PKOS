name: Build Smart PKOS Next Pass

on:
  push:
    paths:
      - ".github/workflows/pkos-next-pass.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore exact current source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d build-assets/Smart-PKOS-next-pass-source-20261028-v2.b64 > source.zip
          echo "80d5e4e1fe171ec7b2f353220116d83e1cd2d258e53e9b6fa1893626d544ecdb  source.zip" | sha256sum -c -
          mkdir app
          unzip -q source.zip -d app

      - name: Gate the intended UI and features
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          grep -F "const TABS=[['/','Home',Home],['/projects','Projects',FolderKanban],['/capture','Capture',Inbox],['/settings','Settings',Settings]];" src/components/Layout.jsx
          grep -F "Chats & saved links" src/pages/Settings.jsx
          grep -F "Use device timezone" src/pages/Settings.jsx
          grep -F "Light Blue" src/pages/Settings.jsx
          grep -F "Red" src/pages/Settings.jsx
          grep -F "recurring_tasks" src/lib/planImport.js
          grep -F "ChatLink" src/pages/ChatLinks.jsx
          grep -F "android.intent.action.SEND" android/app/src/main/AndroidManifest.xml

      - name: Bump install version
        shell: bash
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/build.gradle")
          s=p.read_text()
          s=re.sub(r"versionCode\s+\d+", "versionCode 20261029", s)
          s=re.sub(r'versionName\s+"[^"]+"', 'versionName "2026.10.28-next-pass"', s)
          p.write_text(s)
          PY

      - name: Install, lint, build frontend
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run build
          grep -R -F "Chats & saved links" dist/assets/*.js >/dev/null
          grep -R -F "Use device timezone" dist/assets/*.js >/dev/null
          grep -R -F "No supported Smart PKOS records" dist/assets/*.js >/dev/null

      - name: Sync and build Android
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          npx cap sync android
          grep -R -F "Chats & saved links" android/app/src/main/assets/public/assets/*.js >/dev/null
          grep -F "android.intent.action.SEND" android/app/src/main/AndroidManifest.xml
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Stage unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          cp app/android/app/build/outputs/apk/release/app-release-unsigned.apk Smart-PKOS-NEXT-PASS-20261028-unsigned.apk
          sha256sum Smart-PKOS-NEXT-PASS-20261028-unsigned.apk > Smart-PKOS-NEXT-PASS-20261028-unsigned.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Smart-PKOS-NEXT-PASS-20261028-UNSIGNED
          path: |
            Smart-PKOS-NEXT-PASS-20261028-unsigned.apk
            Smart-PKOS-NEXT-PASS-20261028-unsigned.sha256
          retention-days: 3
          if-no-files-found: error
