name: Build Smart PKOS Task-System APK

on:
  push:
    paths:
      - ".github/workflows/pkos-task-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create Capacitor remote-shell project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/pkos-android
          mkdir -p /tmp/pkos-android/dist
          cd /tmp/pkos-android
          npm init -y
          npm install --no-audit --no-fund             @capacitor/core@7.6.9             @capacitor/cli@7.6.9             @capacitor/android@7.6.9             @capacitor/app@7.0.0             @capacitor/browser@7.0.5
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.smartpkos.app",
            "appName": "Smart PKOS",
            "webDir": "dist",
            "server": {
              "url": "https://gorgeous-smart-brain-flow.base44.app",
              "cleartext": false
            }
          }
          JSON
          cat > dist/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><title>Smart PKOS</title></head><body>Smart PKOS</body></html>
          HTML
          npx cap add android
          npm install --no-audit --no-fund @capacitor/app@7.0.0 @capacitor/browser@7.0.5
          npx cap sync android

      - name: Set version and harden Android shell
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/pkos-android
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle")
          s=p.read_text()
          s=s.replace("versionCode 1", "versionCode 20261027")
          s=s.replace('versionName "1.0"', 'versionName "2026.10.27-task-system"')
          p.write_text(s)
          m=Path("android/app/src/main/AndroidManifest.xml")
          x=m.read_text()
          if "android.permission.INTERNET" not in x:
              x=x.replace("<manifest", '<manifest')
              x=x.replace(">", '>\n    <uses-permission android:name="android.permission.INTERNET" />', 1)
          m.write_text(x)
          PY

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/pkos-android/android
          ./gradlew --no-daemon assembleRelease

      - name: Download verified APK signer
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3             https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar             -o /tmp/uber-apk-signer-1.3.0.jar
          echo "e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  /tmp/uber-apk-signer-1.3.0.jar" | sha256sum -c -

      - name: Stage artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifact
          cp /tmp/pkos-android/android/app/build/outputs/apk/release/app-release-unsigned.apk artifact/Smart-PKOS-task-system-unsigned.apk
          cp /tmp/uber-apk-signer-1.3.0.jar artifact/uber-apk-signer-1.3.0.jar
          cat > artifact/BUILD_INFO.txt <<'EOF'
          Smart PKOS task-system Android wrapper
          Package: com.smartpkos.app
          Version code: 20261027
          Version name: 2026.10.27-task-system
          Remote app: https://gorgeous-smart-brain-flow.base44.app
          Signing: intentionally unsigned; final signing occurs with the existing Smart PKOS key after artifact download.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: smart-pkos-task-system-apk
          path: artifact/*
          if-no-files-found: error
          retention-days: 3
