name: Build Smart PKOS RC4 Correct UI

on:
  push:
    paths:
      - ".github/workflows/pkos-rc4-correct-ui.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download exact RC source and signing key
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://uca5cce4d7d637064336c67d27ce.dl.dropboxusercontent.com/cd/0/get/DKylZUp6PGF9kgqmwacYkO6IMMryGnBZZ1x6T-WqQTbmI84sHjCnIqh5NwOT7rqUyAASCcQGngQwxpzEIkWiIz3-OuKNi1blK83jffznCMKrzJKccu8pFBX5uvD_K8-4yUR_plquQlTYynP7gGzmMtpUvosfOxen2Jff2K6nnt8Z-w/file?c_luid=a4cf56df' -o source.zip
          curl -fL 'https://ucc633271fa7ec095d44f0aead4f.dl.dropboxusercontent.com/cd/0/get/DKxe1doW_eh2RKl-P8LU12YAm8NeV6tW1ndu9xrBzvlpPcdOabWdvtx_LBGzcEQy0veomoOHka6L50Xo_qH0if0-yOccEfLXHg849TRwozkn9FDK77W9TZZreRulN91z8EHpByITnBjtmwQEZxPSeiA6BKf6sckir6h2djNz9cgpGA/file?c_luid=a4cf56df' -o debug.keystore
          unzip -q source.zip
          test -f Smart-PKOS/src/components/Layout.jsx
          test -f Smart-PKOS/android/gradlew

      - name: Lock UI generation
        shell: bash
        working-directory: Smart-PKOS
        run: |
          set -euo pipefail
          grep -F "const TABS=[['/','Home',Home],['/projects','Projects',FolderKanban],['/capture','Capture',Inbox],['/settings','Settings',Settings]];" src/components/Layout.jsx
          grep -F "grid grid-cols-4" src/components/Layout.jsx
          if grep -F "['/today','Today'" src/components/Layout.jsx; then exit 1; fi
          if grep -F "['/goals','Goals'" src/components/Layout.jsx; then exit 1; fi
          if grep -F "['/import','Import'" src/components/Layout.jsx; then exit 1; fi

      - name: Install and verify frontend
        shell: bash
        working-directory: Smart-PKOS
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run build

      - name: Sync web bundle into Android
        shell: bash
        working-directory: Smart-PKOS
        run: |
          set -euo pipefail
          npx cap sync android
          grep -F "Home" android/app/src/main/assets/public/assets/*.js >/dev/null
          grep -F "Projects" android/app/src/main/assets/public/assets/*.js >/dev/null
          grep -F "Capture" android/app/src/main/assets/public/assets/*.js >/dev/null
          grep -F "Settings" android/app/src/main/assets/public/assets/*.js >/dev/null

      - name: Build unsigned release APK
        shell: bash
        working-directory: Smart-PKOS/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Align and sign with existing Smart PKOS certificate
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$BT/apksigner"
          test -x "$BT/zipalign"
          UNSIGNED="Smart-PKOS/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" Smart-PKOS-RC4-CORRECT-UI-aligned.apk
          "$BT/apksigner" sign \
            --ks debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out Smart-PKOS-RC4-CORRECT-UI.apk \
            Smart-PKOS-RC4-CORRECT-UI-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs Smart-PKOS-RC4-CORRECT-UI.apk
          "$BT/zipalign" -c -v 4 Smart-PKOS-RC4-CORRECT-UI.apk
          sha256sum Smart-PKOS-RC4-CORRECT-UI.apk > Smart-PKOS-RC4-CORRECT-UI.sha256

      - name: Upload RC4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-PKOS-RC4-CORRECT-UI
          path: |
            Smart-PKOS-RC4-CORRECT-UI.apk
            Smart-PKOS-RC4-CORRECT-UI.sha256
          if-no-files-found: error
          retention-days: 7
