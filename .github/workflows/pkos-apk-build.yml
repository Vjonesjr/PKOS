name: Smart PKOS Test APK Pass 2
on:
  push:
    paths:
      - ".github/workflows/pkos-apk-build.yml"
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore PKOS source
        run: |
          base64 -d build-input/pkos-source-20261031.zip.b64 > source.zip
          echo "2b475a3d0a83bedb2912580efc2fd387c2d1105c2487e9ae53e9d2f79fb6ad67  source.zip" | sha256sum -c -
          mkdir app
          unzip -q source.zip -d app
          test -f app/src/pages/Tasks.jsx
      - name: Separate test app identity
        run: |
          sed -i 's/applicationId "com.smartpkos.app"/applicationId "com.smartpkos.test"/' app/android/app/build.gradle
          sed -i 's/<string name="app_name">Smart PKOS<\/string>/<string name="app_name">Smart PKOS Test<\/string>/' app/android/app/src/main/res/values/strings.xml
          grep -F 'applicationId "com.smartpkos.test"' app/android/app/build.gradle
      - name: Apply Smart PKOS test improvements
        run: |
          python3 build-assets/smart-pkos-test-pass2.py
          grep -F 'aria-label="Scroll to top"' app/src/components/Layout.jsx
      - name: Build frontend
        working-directory: app
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Build Android APK
        working-directory: app
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK
        run: |
          APK=app/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Smart-PKOS-Test-Pass-2-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
