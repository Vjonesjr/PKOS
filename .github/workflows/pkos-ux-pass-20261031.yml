name: Build Smart PKOS UX Pass 2026-10-31

on:
  push:
    paths:
      - ".github/workflows/pkos-ux-pass-20261031.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download exact source snapshot and signer
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprwestus.oaiusercontent.com/files/00000000-f16c-8230-8d8f-4443287ded13/raw?se=2026-10-31T17%3A39%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=ef4bf65f-1750-5c1f-aeae-ecca2925549d&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-31T12%3A58%3A42Z&ske=2026-11-01T12%3A58%3A42Z&sks=b&skv=2026-02-06&sig=HHzG1pDu4e70I0NFprJl/0kGGa%2Bqtp26dX/8KFWDI58%3D' -o source.zip
          curl -fL 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-993c-81f7-84f8-31c0328d111e/raw?se=2026-10-31T17%3A39%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=9b8aaf2b-d538-54f7-8a53-86697da59200&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-31T16%3A08%3A48Z&ske=2026-11-01T16%3A08%3A48Z&sks=b&skv=2026-02-06&sig=0PtAXB3SQs3cYuByVGoMjGdAfZygAUb308F4kUkJgE0%3D' -o debug.keystore
          echo "2b475a3d0a83bedb2912580efc2fd387c2d1105c2487e9ae53e9d2f79fb6ad67  source.zip" | sha256sum -c -
          echo "61ec6cb786c6212e23f96ef765a19918778e775d0023554a68e69cb7d77d289c  debug.keystore" | sha256sum -c -
          mkdir app
          unzip -q source.zip -d app
          test -f app/src/pages/Tasks.jsx
          test -f app/android/gradlew

      - name: Prove the intended source before build
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          grep -F "const TABS=[['/','Home',Home],['/projects','Projects',FolderKanban],['/capture','Capture',Inbox],['/settings','Settings',Settings]];" src/components/Layout.jsx
          grep -F "All task groups" src/pages/Tasks.jsx
          grep -F "Midnight Blue" src/pages/Settings.jsx
          grep -F "Some sources did not respond" src/pages/Search.jsx
          grep -F "TOAST_REMOVE_DELAY = 1000" src/components/ui/use-toast.jsx
          grep -F "versionCode 20261032" android/app/build.gradle

      - name: Install and build frontend
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run build
          grep -R -F "All task groups" dist/assets/*.js >/dev/null
          grep -R -F "Midnight Blue" dist/assets/*.js >/dev/null
          grep -R -F "Some sources did not respond" dist/assets/*.js >/dev/null
          grep -R -F "Optional features" dist/assets/*.js >/dev/null

      - name: Sync and build Android
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          npx cap sync android
          grep -R -F "All task groups" android/app/src/main/assets/public/assets/*.js >/dev/null
          grep -R -F "Midnight Blue" android/app/src/main/assets/public/assets/*.js >/dev/null
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Align, sign, verify
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="app/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" Smart-PKOS-UX-PASS-aligned.apk
          "$BT/apksigner" sign             --ks debug.keystore             --ks-key-alias androiddebugkey             --ks-pass pass:android             --key-pass pass:android             --out Smart-PKOS-UX-PASS-20261031.apk             Smart-PKOS-UX-PASS-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs Smart-PKOS-UX-PASS-20261031.apk | tee verify.txt
          "$BT/zipalign" -c -v 4 Smart-PKOS-UX-PASS-20261031.apk >/dev/null
          unzip -t Smart-PKOS-UX-PASS-20261031.apk >/dev/null
          sha256sum Smart-PKOS-UX-PASS-20261031.apk | tee Smart-PKOS-UX-PASS-20261031.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Smart-PKOS-UX-PASS-20261031
          path: |
            Smart-PKOS-UX-PASS-20261031.apk
            Smart-PKOS-UX-PASS-20261031.sha256
            verify.txt
          if-no-files-found: error
          retention-days: 7
