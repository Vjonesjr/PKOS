name: Smart PKOS integration branch APK build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-integration-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_BASE44_APP_ID: "6ab97588d935cf6dad456bf1"
      VITE_BASE44_APP_BASE_URL: "https://gorgeous-smart-brain-flow.base44.app"
    steps:
      - name: Check out final integration source
        uses: actions/checkout@v4
        with:
          ref: smart-pkos-final-integration-20261102
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          test -d "$SDK"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$MANAGER" ]; then
            MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$MANAGER" && test -x "$MANAGER"
          echo "Using SDK manager: $MANAGER"
          set +o pipefail
          yes | "$MANAGER" --licenses >/dev/null
          set -o pipefail
          "$MANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"
      - name: Sync Android
        run: npx cap sync android
      - name: Build Android debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smart-pkos-integration-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
