name: Build Smart PKOS UX Pass Exact

on:
  push:
    paths:
      - ".github/workflows/pkos-ux-pass-exact.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore exact patched UX source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://ucc85a7b4eec6a5c0f1576be42cf.dl.dropboxusercontent.com/cd/0/get/DK6y80Qyw9LWk4upUmO_82Po2AsVml_nYLKyNaACJLBtPd8nCwtvaWjpYZl2AmQKdGaldf69NWRmICbYeekotV1tEkXgluXINna6GKudlgEjvD0MLGg-tmeQ--YIxl8pXhFVhEvEpSIrYQVblfQMGHVYRVDnrdr6a03pjb7tU0qHDg/file?c_luid=a4cf56df' -o source.zip
          echo "ab2a10bdb6f257d278c9f20130408a3de799a27f8dcb4e20ade7e7660388f40c  source.zip" | sha256sum -c -
          mkdir app
          unzip -q source.zip -d app

      - name: Gate requested UX changes
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          grep -F "const TABS=[['/','Home',Home],['/projects','Projects',FolderKanban],['/capture','Capture',Inbox],['/settings','Settings',Settings]];" src/components/Layout.jsx
          grep -F "Showing available results." src/pages/Search.jsx
          grep -F "Optional feature visibility" src/pages/Settings.jsx
          grep -F "Purple Night" src/pages/Settings.jsx
          grep -F "Extra large" src/pages/Settings.jsx
          grep -F "Brief / no-nonsense" src/pages/Settings.jsx
          grep -F '["compact", "Compact"]' src/components/queue/QueueControls.jsx
          grep -F "Task groups" src/pages/Tasks.jsx
          grep -F "Repeating schedules" src/pages/Tasks.jsx
          grep -F "Chats & saved links" src/pages/Settings.jsx
          grep -F "android.intent.action.SEND" android/app/src/main/AndroidManifest.xml

      - name: Bump install version
        shell: bash
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/build.gradle")
          s=p.read_text()
          s=re.sub(r"versionCode\s+\d+", "versionCode 20261030", s)
          s=re.sub(r'versionName\s+"[^"]+"', 'versionName "2026.10.28-ux-pass"', s)
          p.write_text(s)
          PY

      - name: Install, lint, build frontend
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run build
          grep -R -F "Showing available results." dist/assets/*.js >/dev/null
          grep -R -F "Optional feature visibility" dist/assets/*.js >/dev/null
          grep -R -F "Repeating schedules" dist/assets/*.js >/dev/null

      - name: Sync and build Android
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          npx cap sync android
          grep -R -F "Optional feature visibility" android/app/src/main/assets/public/assets/*.js >/dev/null
          grep -F "android.intent.action.SEND" android/app/src/main/AndroidManifest.xml
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Download signer
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://uc9cdf53b8dffa5a4888ae495662.dl.dropboxusercontent.com/cd/0/get/DK6vvrHQuAByPLZghcQTLpJIzfeJqqNDKAhKbrtOLfYFdSWzspgoyRD96S-U7VNzHVlYsygQIwhh8jo6TCUn9LXCtM6nUdqPZH92lpNcpM9NNg0VvQs2SMDtm1xDktdaLQD5hAb0KJKC5mSzR2OcZJFMX-F1ZjDCre5CI2StKh0BPQ/file?c_luid=a4cf56df' -o debug.keystore
          echo "61ec6cb786c6212e23f96ef765a19918778e775d0023554a68e69cb7d77d289c  debug.keystore" | sha256sum -c -

      - name: Align, sign, verify
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="app/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" Smart-PKOS-UX-PASS-aligned.apk
          "$BT/apksigner" sign             --ks debug.keystore             --ks-key-alias androiddebugkey             --ks-pass pass:android             --key-pass pass:android             --out Smart-PKOS-UX-PASS-20261028.apk             Smart-PKOS-UX-PASS-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs Smart-PKOS-UX-PASS-20261028.apk | tee verify.txt
          "$BT/zipalign" -c -v 4 Smart-PKOS-UX-PASS-20261028.apk >/dev/null
          unzip -t Smart-PKOS-UX-PASS-20261028.apk >/dev/null
          sha256sum Smart-PKOS-UX-PASS-20261028.apk | tee Smart-PKOS-UX-PASS-20261028.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Smart-PKOS-UX-PASS-20261028
          path: |
            Smart-PKOS-UX-PASS-20261028.apk
            Smart-PKOS-UX-PASS-20261028.sha256
            verify.txt
          retention-days: 7
          if-no-files-found: error
