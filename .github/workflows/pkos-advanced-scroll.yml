name: Smart PKOS Advanced Scroll Test
on:
  push:
    branches: [smart-pkos-advanced-scroll-20261101]
    paths: ['scroll-pass/**', '.github/workflows/pkos-advanced-scroll.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Recover complete source
        run: |
          cat scroll-pass/source.part*.b64 | base64 -d > Smart-PKOS-Advanced-Scroll-Source.zip
          sha256sum -c scroll-pass/source.sha256
          mkdir app
          unzip -q Smart-PKOS-Advanced-Scroll-Source.zip -d app
          cp scroll-pass/fixes/main.jsx app/tests/scroll/main.jsx
          cp scroll-pass/fixes/api.js app/tests/scroll/api.js
      - name: Install and verify frontend
        working-directory: app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run build
          npm install --prefix /tmp/pkos-qa playwright@1.56.1 --no-audit --no-fund
          /tmp/pkos-qa/node_modules/.bin/playwright install --with-deps chromium
          node node_modules/vite/bin/vite.js --config tests/scroll/vite.config.js > /tmp/qa-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4174/ > /dev/null && break; sleep 1; done
          PLAYWRIGHT_MODULE=/tmp/pkos-qa/node_modules/playwright/index.mjs node tests/scroll/run.mjs
      - name: Build separate signed Android APK
        working-directory: app
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ../Smart-PKOS-Advanced-Scroll-TEST.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs ../Smart-PKOS-Advanced-Scroll-TEST.apk | tee verification/scroll/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ../Smart-PKOS-Advanced-Scroll-TEST.apk > verification/scroll/package.txt
          grep -F "name='com.smartpkos.app.scrolltest'" verification/scroll/package.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' verification/scroll/signature.txt
          sha256sum ../Smart-PKOS-Advanced-Scroll-TEST.apk > verification/scroll/apk.sha256
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android installation and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install Smart-PKOS-Advanced-Scroll-TEST.apk
            adb logcat -c
            adb shell am start -W -n com.smartpkos.app.scrolltest/com.smartpkos.app.MainActivity | tee app/verification/scroll/launch.txt
            sleep 12
            adb shell pidof com.smartpkos.app.scrolltest | tee app/verification/scroll/pid.txt
            test -s app/verification/scroll/pid.txt
            adb shell dumpsys activity activities > app/verification/scroll/activity.txt
            grep -E 'mResumedActivity.*com.smartpkos.app.scrolltest|topResumedActivity.*com.smartpkos.app.scrolltest' app/verification/scroll/activity.txt
            adb shell uiautomator dump /sdcard/scroll-ui.xml
            adb pull /sdcard/scroll-ui.xml app/verification/scroll/android-ui.xml
            adb logcat -d -s AndroidRuntime:E > app/verification/scroll/android-errors.txt
            ! grep -F 'FATAL EXCEPTION' app/verification/scroll/android-errors.txt
      - name: Save verified deliverables
        uses: actions/upload-artifact@v4
        with:
          name: Smart-PKOS-Advanced-Scroll-Verified
          path: |
            Smart-PKOS-Advanced-Scroll-TEST.apk
            Smart-PKOS-Advanced-Scroll-Source.zip
            app/verification/scroll/**
          if-no-files-found: error
          retention-days: 90
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Smart-PKOS-Scroll-Diagnostics
          path: |
            app/verification/scroll/**
            /tmp/qa-vite.log
            app/android/app/build/reports/**
          retention-days: 30

