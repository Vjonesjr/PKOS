name: Build Smart PKOS UX Pass

on:
  push:
    paths:
      - ".github/workflows/pkos-ux-pass.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore exact current source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d build-assets/Smart-PKOS-next-pass-source-20261028-v2.b64 > source.zip
          echo "80d5e4e1fe171ec7b2f353220116d83e1cd2d258e53e9b6fa1893626d544ecdb  source.zip" | sha256sum -c -
          mkdir app
          unzip -q source.zip -d app

      - name: Apply UX overlay
        shell: bash
        run: |
          set -euo pipefail
          cat             build-assets/pkos-ux-overlay-20261028.b64             build-assets/pkos-ux-overlay-20261028.part2.b64             build-assets/pkos-ux-overlay-20261028.part3.b64             build-assets/pkos-ux-overlay-20261028.part4.b64             build-assets/pkos-ux-overlay-20261028.part5.b64             | base64 -d > /tmp/ux-overlay.tgz
          echo "d4c01325f1b36a2edc95041cf400d96f72bc4811fcb421cc1b0abbdde2193d8f  /tmp/ux-overlay.tgz" | sha256sum -c -
          tar -xzf /tmp/ux-overlay.tgz -C app

      - name: Gate UI and requested fixes
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          grep -F "const TABS=[['/','Home',Home],['/projects','Projects',FolderKanban],['/capture','Capture',Inbox],['/settings','Settings',Settings]];" src/components/Layout.jsx
          grep -F "Showing available results." src/pages/Search.jsx
          grep -F "Optional feature visibility" src/pages/Settings.jsx
          grep -F "Purple Night" src/pages/Settings.jsx
          grep -F "Extra large" src/pages/Settings.jsx
          grep -F "Brief / no-nonsense" src/pages/Settings.jsx
          grep -F '["compact", "Compact"]' src/components/queue/QueueControls.jsx
          grep -F "Task groups" src/pages/Tasks.jsx
          grep -F "Repeating schedules" src/pages/Tasks.jsx
          grep -F "Chats & saved links" src/pages/Settings.jsx
          grep -F "android.intent.action.SEND" android/app/src/main/AndroidManifest.xml

      - name: Bump install version
        shell: bash
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/build.gradle")
          s=p.read_text()
          s=re.sub(r"versionCode\s+\d+", "versionCode 20261030", s)
          s=re.sub(r'versionName\s+"[^"]+"', 'versionName "2026.10.28-ux-pass"', s)
          p.write_text(s)
          PY

      - name: Install, lint, build frontend
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run build
          grep -R -F "Showing available results." dist/assets/*.js >/dev/null
          grep -R -F "Optional feature visibility" dist/assets/*.js >/dev/null
          grep -R -F "Repeating schedules" dist/assets/*.js >/dev/null

      - name: Sync and build Android
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          npx cap sync android
          grep -R -F "Optional feature visibility" android/app/src/main/assets/public/assets/*.js >/dev/null
          grep -F "android.intent.action.SEND" android/app/src/main/AndroidManifest.xml
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Download signer
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://uc73e6047cd80da1cb6a3c2f7ac8.dl.dropboxusercontent.com/cd/0/get/DK7lZims7bUW5h2gfSMcU4NVD6BBZtCYxTMHuTICJZ7IRckF5Zh_ZqwIGlN4oXihPGx-8E1R3titQ764gDty7mtWrIATRvyJy8ZsY7cvKoWYsxsAsx4zHYItJaRolWoM0xaPFHGccbZ4geoyIMwcpfEaSIniyAgjtusAxu5qx8Hq-w/file?c_luid=a4cf56df' -o debug.keystore
          echo "61ec6cb786c6212e23f96ef765a19918778e775d0023554a68e69cb7d77d289c  debug.keystore" | sha256sum -c -

      - name: Align, sign, verify
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="app/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" Smart-PKOS-UX-PASS-aligned.apk
          "$BT/apksigner" sign             --ks debug.keystore             --ks-key-alias androiddebugkey             --ks-pass pass:android             --key-pass pass:android             --out Smart-PKOS-UX-PASS-20261028.apk             Smart-PKOS-UX-PASS-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs Smart-PKOS-UX-PASS-20261028.apk | tee verify.txt
          "$BT/zipalign" -c -v 4 Smart-PKOS-UX-PASS-20261028.apk >/dev/null
          unzip -t Smart-PKOS-UX-PASS-20261028.apk >/dev/null
          sha256sum Smart-PKOS-UX-PASS-20261028.apk | tee Smart-PKOS-UX-PASS-20261028.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Smart-PKOS-UX-PASS-20261028
          path: |
            Smart-PKOS-UX-PASS-20261028.apk
            Smart-PKOS-UX-PASS-20261028.sha256
            verify.txt
          retention-days: 7
          if-no-files-found: error
